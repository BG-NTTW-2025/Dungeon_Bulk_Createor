<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Bulk Puzzel Injector</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 40px; }
        .box { background: #16213e; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a2e; border: 1px solid #0f3460; color: #fff; border-radius: 4px; }
        button { background: #4caf50; color: white; border: none; padding: 12px 20px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { opacity: 0.8; }
        #status { margin-top: 15px; font-weight: bold; color: #ff9800; }
    </style>
</head>
<body>

<div class="box">
    <h2>Bulk 10 Puzzels Invoeren (Per Categorie)
	<br> Log eerst in,<br> Account Myopi2022@outlook.com
	</h2>
    <label>Designer ID (UUID of bijv. een test ID):</label>
    <input type="text" id="designerIdInput" value="bb7d2ddf-88be-4ba7-8578-91dd6cc768d0">

    <label>Vertraging tussen zendingen (milisec):</label>
    <input type="number" id="delayInput" value="100">

    <button onclick="startBulkInject()">Start 10 Puzzels Verzenden</button>
    <div id="status">Klaar om te starten...</div>
</div>

<script>
    const SUPABASE_URL = 'https://mgqoxmnryqekrpjglffb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_btgAerx5A8O7urSEflRDAg_8NSdtoOu';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // De 10 categorieën exact zoals gebruikt in het platform
    const categoriesList = [
        "General",
        "Logic",
        "Geography",
        "Entertainment",
        "History",
        "Art and Literature",
        "Science and Nature",
        "Sports and Recreation",
        "Kids",
        "Nerds"
    ];

    function getOppositeWall(wall) {
        switch (wall) {
            case 'north': return 'south';
            case 'south': return 'north';
            case 'east': return 'west';
            case 'west': return 'east';
            default: return null;
        }
    }

    function getOffset(wall) {
        switch (wall) {
            case 'north': return { x: 0, y: 1 };
            case 'south': return { x: 0, y: -1 };
            case 'east':  return { x: 1, y: 0 };
            case 'west':  return { x: -1, y: 0 };
            default: return { x: 0, y: 0 };
        }
    }

    async function startBulkInject() {
        const designerId = document.getElementById('designerIdInput').value.trim();
        const delay = parseInt(document.getElementById('delayInput').value) || 100;
        const statusDiv = document.getElementById('status');

        if (!designerId) {
            alert("Vul een geldig designer_id in!");
            return;
        }

        statusDiv.style.color = "#ff9800";
        statusDiv.textContent = "Bezig met starten...";

        const directions = ['north', 'south', 'east', 'west'];
		
// Haal de username op voor de designers-tabel
let { data: designerData } = await supabaseClient
    .from('designers')
    .select('username')
    .eq('id', designerId)
    .single();

const currentUsername = designerData ? designerData.username : 'Unknown';		

        for (let i = 0; i < categoriesList.length; i++) {
            let puzzleNum = i + 11;
            let currentCategory = categoriesList[i];
            
            statusDiv.textContent = `Bezig met verzenden puzzel ${puzzleNum} van 10 (Categorie: ${currentCategory})...`;

            // Haal bestaande kamers op gefilterd op de huidige categorie-labyrint
            let { data: existingPuzzles, error: fetchError } = await supabaseClient
                .from('puzzle_labyrinth')
                .select('room_id, wall_side, pos_x, pos_y, category')
                .eq('category', currentCategory);

            if (fetchError) {
                console.error(`Fout bij ophalen labyrinth voor ${currentCategory}:`, fetchError.message);
                continue;
            }

            let selectedRoomId, selectedWall, currentRoomCoord, targetX, targetY, targetRoomId, oppositeWall;

            if (!existingPuzzles || existingPuzzles.length === 0) {
                selectedRoomId = 1;
                selectedWall = 'south';
                currentRoomCoord = { x: 0, y: 0 };
                oppositeWall = getOppositeWall(selectedWall);
                let offset = getOffset(selectedWall);
                targetX = offset.x;
                targetY = offset.y;
                targetRoomId = 2;
            } else {
                let roomIds = [...new Set(existingPuzzles.map(p => p.room_id))].sort((a, b) => b - a);
                let topRoomIds = roomIds.slice(0, 30);
                let foundSpot = false;

                for (let attempt = 0; attempt < 400; attempt++) {
                    let pool = (attempt < 300 && topRoomIds.length > 0) ? topRoomIds : roomIds;
                    let candidateRoomId = pool[Math.floor(Math.random() * pool.length)];
                    let roomRecord = existingPuzzles.find(p => p.room_id === candidateRoomId);
                    if (!roomRecord || roomRecord.pos_x === null || roomRecord.pos_y === null) continue;

                    let occupiedWalls = existingPuzzles
                        .filter(p => p.room_id === candidateRoomId)
                        .map(p => p.wall_side);

                    let freeWalls = directions.filter(dir => !occupiedWalls.includes(dir));

                    if (freeWalls.length > 0) {
                        let potentialWall = freeWalls[Math.floor(Math.random() * freeWalls.length)];
                        let doorCount = occupiedWalls.length; 
                        
                        let p = Math.floor(Math.random() * 10) + 1; 
                        let allowDoor = false;

                        if (doorCount === 1) {
                            allowDoor = true; 
                        } else if (doorCount === 2) {
                            if (p > 4) allowDoor = true; 
                        } else if (doorCount === 3) {
                            if (p === 10) allowDoor = true; 
                        } else {
                            allowDoor = true;
                        }

                        if (allowDoor) {
                            selectedRoomId = candidateRoomId;
                            currentRoomCoord = { x: roomRecord.pos_x, y: roomRecord.pos_y };
                            selectedWall = potentialWall;
                            foundSpot = true;
                            break;
                        }
                    }
                }

                if (!foundSpot) {
                    selectedRoomId = Math.max(...roomIds) + 1;
                    selectedWall = 'north';
                    currentRoomCoord = { x: 0, y: 0 };
                }

                oppositeWall = getOppositeWall(selectedWall);
                let offset = getOffset(selectedWall);
                targetX = currentRoomCoord.x + offset.x;
                targetY = currentRoomCoord.y + offset.y;

                let existingTargetRoom = existingPuzzles.find(p => p.pos_x === targetX && p.pos_y === targetY);
                if (existingTargetRoom) {
                    targetRoomId = existingTargetRoom.room_id;
                } else {
                    targetRoomId = Math.max(...roomIds, 0) + 1;
                }
            }

            const { error: insertError } = await supabaseClient
                .from('puzzle_labyrinth')
                .insert([
                    {
                        designer_id: designerId,
						designer_name: currentUsername,
                        puzzle_name: String(puzzleNum)+ " (Parent)",
                        question: String(puzzleNum)+ " (A)",
                        answer: String(puzzleNum),
                        category: currentCategory,
                        google_timer: 0,
                        max_reward: 30,
                        chicken_penalty: 0,
                        wrong_penalty: 10,
                        reveal_answer: 'free_answer',
                        credits_cost: 5,
                        likes: 0,
                        dislikes: 0,
                        room_id: selectedRoomId,
                        wall_side: selectedWall,
                        pos_x: currentRoomCoord.x,
                        pos_y: currentRoomCoord.y,
                        is_open: false
                    },
                    {
                        designer_id: designerId,
						designer_name: currentUsername,
                        puzzle_name: String(puzzleNum) + " (Child)",
                        question: String(puzzleNum),
                        answer: String(puzzleNum),
                        category: currentCategory,
                        google_timer: 0,
                        max_reward: 30,
                        chicken_penalty: 0,
                        wrong_penalty: 10,
                        reveal_answer: 'free_answer',
                        credits_cost: 5,
                        likes: 0,
                        dislikes: 0,
                        room_id: targetRoomId,
                        wall_side: oppositeWall,
                        pos_x: targetX,
                        pos_y: targetY,
                        is_open: false
                    }
                ]);

            if (insertError) {
                console.error(`Fout bij toevoegen puzzel ${puzzleNum}:`, insertError.message);
            }

            await new Promise(resolve => setTimeout(resolve, delay));
        }

        statusDiv.style.color = "#4caf50";
        statusDiv.textContent = "Klaar! Exact 10 puzzels (1 per categorie) succesvol toegevoegd.";
    }
</script>

</body>
</html>
